services:
    db:
        image: postgres:16.3
        container_name: postgres-db
        environment:
            POSTGRES_DB: gopher-social-network
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin123
        volumes:
            - db-data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

volumes:
    db-data:
